name: Upstream Senkron

# Emrodev/IPVIO-Stream ana dalını her gün denetler. Yeni commit varsa fork'un
# main dalına DOĞRUDAN merge eder ve pushlar. Fork'a özel değişiklikler korunur:
#   - README*, FORK.md, docs/, .github/workflows/  → fork sürümü kalır
#   - AppUpdate.kt güncelleme uç noktaları           → ptmy53/IPVIO-Stream-TR kalır
#   - Dict*.kt                                       → Türkçe sütun fork'tan geri yüklenir
#   - DictConsistencyTest.kt                         → fork sürümü kalır
# Çakışmalar çözülüp testler geçerse main pushlanır; versionName değiştiyse
# v<paket> etiketi atılır ve imzalı APK otomatik release olarak yayınlanır.
# Testler geçmezse merge geri alınır ve inceleme için PR açılır.
# Saat: 04:00 Türkiye / 01:00 UTC.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Emrodev/IPVIO-Stream.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    name: Emrodev/IPVIO-Stream senkronu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Upstream'i getir ve farkı denetle
        id: check
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "state=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Upstream güncel."
          else
            echo "state=behind" >> "$GITHUB_OUTPUT"
            echo "Yeni upstream commitleri:"
            git log --oneline "HEAD..upstream/$UPSTREAM_BRANCH" | head -50
          fi

      - name: Otomatik merge (fork değişiklikleri korunarak)
        id: merge
        if: ${{ steps.check.outputs.state == 'behind' }}
        run: |
          set -e
          git config user.name "opencode-sync"
          git config user.email "opencode-sync@users.noreply.github.com"
          git config core.quotepath false
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "mode=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=conflict" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, re, subprocess

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          status = run("git", "status", "--porcelain")
          conflicted = []
          for line in status.splitlines():
              code, path = line[:2], line[3:]
              if code in ("UU", "AA", "DU"):
                  conflicted.append(path)
              elif code == "UD":
                  run("git", "rm", "--", path)

          fork_only = re.compile(r"(^|/)(README(\.en|\.tr)?\.md$|FORK\.md$|docs/|\.github/workflows/|DictConsistencyTest\.kt$)")
          dict_re = re.compile(r"Dict[A-Za-z0-9]+\.kt$")

          # Fork'un Türkçe sütunlarını sakla (de -> tr)
          ours_tr = {}
          for f in conflicted:
              if dict_re.search(f):
                  try:
                      content = run("git", "show", f"HEAD:{f}")
                  except Exception:
                      content = ""
                  m = {}
                  for line in content.splitlines():
                      if "¦" in line and not line.lstrip().startswith("#"):
                          cols = line.split("¦")
                          if len(cols) >= 3:
                              m[cols[0].strip()] = cols[2].strip()
                  ours_tr[f] = m

          for f in conflicted:
              if fork_only.search(f):
                  run("git", "checkout", "--ours", "--", f)
              else:
                  run("git", "checkout", "--theirs", "--", f)

          # Fork'a özel düzeltmeleri yeniden uygula
          for f in conflicted:
              if not os.path.isfile(f):
                  continue
              try:
                  text = open(f, encoding="utf-8").read()
              except Exception:
                  continue
              orig = text
              if f.endswith("AppUpdate.kt"):
                  # Güncelleme uç noktaları bu forku işaret etsin
                  text = text.replace("Emrodev/IPVIO-Stream", "ptmy53/IPVIO-Stream-TR")
              if dict_re.search(f) and f in ours_tr:
                  out = []
                  for line in text.splitlines(keepends=True):
                      nl = "\n" if line.endswith("\n") else ""
                      line = line.rstrip("\r\n")
                      if "¦" in line and not line.lstrip().startswith("#"):
                          cols = line.split("¦")
                          if len(cols) >= 3:
                              key, en, tr = cols[0].strip(), cols[1].strip(), cols[2].strip()
                              src = ours_tr[f].get(key, "")
                              if (tr == "" or tr == en) and src:
                                  cols[2] = src
                                  line = "¦".join(cols)
                      out.append(line + nl)
                  text = "".join(out)
              if text != orig:
                  open(f, "w", encoding="utf-8").write(text)

          run("git", "add", "-A")
          print("Çözülen çakışmalar:", ", ".join(conflicted) or "(yok)")
          PY
          git commit --no-edit

      - name: Birim testler
        id: tests
        if: ${{ steps.check.outputs.state == 'behind' }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Main'e pushla ve sürüm etiketi at
        id: push
        if: ${{ steps.check.outputs.state == 'behind' }}
        run: |
          set -e
          git push origin "$TARGET_BRANCH"
          VERSION=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag=exists" >> "$GITHUB_OUTPUT"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Özet
        if: ${{ success() && steps.check.outputs.state == 'behind' }}
        run: |
          {
            echo "### Upstream senkron tamamlandı"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Mod | \`${{ steps.merge.outputs.mode }}\` |"
            echo "| Sürüm | \`v${{ steps.push.outputs.version }}\` |"
            echo "| Etiket | \`${{ steps.push.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Fallback: testler geçmezse merge'i geri al, inceleme için PR aç ---
      - name: Merge'i geri al
        id: revert
        if: ${{ failure() && steps.merge.outputs.mode != '' }}
        run: git reset --hard ORIG_HEAD

      - name: PR aç (otomatik merge başarısız oldu)
        if: ${{ failure() && steps.merge.outputs.mode != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="upstream-sync/main"
          git push origin "upstream/$UPSTREAM_BRANCH:refs/heads/$BRANCH" --force
          EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          if [ -z "$EXISTING" ]; then
            set +e
            gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
              --title "chore(upstream): $(date -u +%F) senkronu (çakışma/çözümlenemedi)" \
              --body "Otomatik merge testleri geçmedi veya çözülemedi. İnceleme gerekiyor. Fork'a özel Dict*.kt Türkçe sütunları ve README/docs korunmalı." || true
            set -e
            EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          fi
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING incelemeye hazır."
          else
            echo "::error::PR açılamadı. Repo Actions ayarlarında 'Allow GitHub Actions to create and approve pull requests' gerekli."
          fi
